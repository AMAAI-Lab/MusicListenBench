# The four tasks: one per musical attribute. Each task is a two-clip trial.
# Test budget: 250 items per task (1,000 in total); train budget: 2,500 per task
# (10,000 in total). Items are spread evenly over the task's difficulty levels
# ("ladder"), or weighted for the timbre task's same/different balance.
#
# Each task carries its own question wording (`prompt`), its reversed-option
# twin, and `swap_flips_gold` (whether the gold answer changes when the two clips
# swap places). The wordings used in the released benchmark files are the
# hand-written paraphrase pools in musiclistenbench/benchmark/build_probe.py.
# All four ladders use exact semitone multiples, so no sub-semitone pitch bend
# is ever needed.

tasks:
  Q1_melody:
    labels: [same, different]
    prompt:
      question: "You will hear two clips. Do they contain the same melody, ignoring the instrument and recording? Answer with exactly one word: same or different."
      question_reversed: "You will hear two clips. Do they contain the same melody, ignoring the instrument and recording? Answer with exactly one word: different or same."
      signal_class: different
      swap_flips_gold: false
    ladder: {unit: cents, values: [100, 200, 400, 700]}   # 1/2/4/7 semitones
    content_dial: note_identity
    window_seconds: 2.5
    catch_trials: true
    catch_trial_fraction: 0.1
    budget: {test_total: 250, train_total: 2500}
    params:
      # Train and test pitch pools are disjoint, so a content key can never
      # collide across the split.
      reference_midi_pool: {train: [60, 62, 64, 65, 67, 69, 71, 72], test: [55, 57, 58, 59]}
      note_dur_seconds: 0.4
      n_notes: 4
      edited_note_index: 1   # which of the 4 notes the content edit moves; fixed for determinism

  Q2_harmony:
    labels: [same, different]
    prompt:
      question: "You will hear two clips, each a single chord. Is the chord the same in both, or different? Answer with exactly one word: same or different."
      question_reversed: "You will hear two clips, each a single chord. Is the chord the same in both, or different? Answer with exactly one word: different or same."
      signal_class: different
      swap_flips_gold: false
    ladder: {unit: cents, values: [100, 200, 300]}   # 100 cents is the plain major/minor flip
    content_dial: third_quality
    window_seconds: 2.0
    catch_trials: true
    catch_trial_fraction: 0.1
    budget: {test_total: 250, train_total: 2500}
    params:
      # Root pool split train/test (register axis dropped vs the old
      # M1_chord_atom -- root is now just a decorrelated free variable, not
      # a graded rung). Direction of the third-shift is NOT a free choice:
      # major (root+400c) always shifts DOWN, minor (root+300c) always
      # shifts UP, so every rung from every starting quality lands in
      # [root+100c, root+600c] -- safely inside the configured margin from
      # both the root (0c) and the fifth (700c). See symbolic.py.
      root_midi_pool: {train: [48, 50, 52, 53, 55, 57, 59, 60], test: [62, 64, 65, 67]}
      chord_dur_seconds: 1.5
      third_margin_cents: 50   # min distance the shifted third must keep from 0c and 700c

  Q3_timbre:
    labels: [same, different]
    prompt:
      question: "You will hear two clips. Are they played by the same instrument? Answer with exactly one word: same or different."
      question_reversed: "You will hear two clips. Are they played by the same instrument? Answer with exactly one word: different or same."
      signal_class: different
      swap_flips_gold: false
    ladder: null   # categorical program pairs, no magnitude
    content_dial: instrument
    window_seconds: 2.5
    catch_trials: true
    catch_trial_fraction: 0.1
    budget: {test_total: 250, train_total: 2500}
    params:
      # Uses the melody task's construction parameters (same phrase length and
      # pitch pools); each task still renders its own audio.
      reference_midi_pool: {train: [60, 62, 64, 65, 67, 69, 71, 72], test: [55, 57, 58, 59]}
      note_dur_seconds: 0.4
      n_notes: 4
      # General MIDI programs: piano, guitar, violin, flute. Close pairs such as
      # acoustic and electric piano are excluded, so every pair is cross-family.
      gm_programs: [0, 24, 40, 73]

  Q4_rhythm:
    labels: [first, second]   # which click track is faster
    prompt:
      question: "You will hear two clips. Which one is faster? Answer with exactly one word: first or second."
      question_reversed: "You will hear two clips. Which one is faster? Answer with exactly one word: second or first."
      signal_class: second
      swap_flips_gold: true   # "first"/"second" is literally about physical clip position
    ladder: {unit: ratio, values: [1.10, 1.20, 1.35, 1.50]}
    content_dial: pulse_rate
    window_seconds: 4.0
    catch_trials: false   # spec: catches apply to rows 1-3 only
    budget: {test_total: 250, train_total: 2500}
    params:
      click_midi: 42            # GM drum map: closed hi-hat
      base_rate_hz: 2.0
      click_dur_seconds: 0.05
